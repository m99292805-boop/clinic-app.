name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-app

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm install

      - name: بناء تطبيق الويب
        run: npm run build

      - name: إضافة Android إذا لم يكن موجوداً
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بناء APK
        working-directory: clinic-app/android
        run: ./gradlew assembleDebug

      - name: بناء AAB
        working-directory: clinic-app/android
        run: ./gradlew bundleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: clinic-app-APK
          path: clinic-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: رفع AAB
        uses: actions/upload-artifact@v4
        with:
          name: clinic-app-AAB
          path: clinic-app/android/app/build/outputs/bundle/debug/app-debug.aab
